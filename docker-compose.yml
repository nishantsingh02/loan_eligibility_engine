name: clickpe-loan-engine
services:
  db:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: loan_engine
      POSTGRES_USER: loan_engine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loan_engine}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loan_engine -d loan_engine"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  api:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://loan_engine:${POSTGRES_PASSWORD:-loan_engine}@db:5432/loan_engine
      LOCAL_UPLOAD_DIR: /data/uploads
      APP_ENV: ${APP_ENV:-development}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    command: ["sh", "-c", "python -m app.migrate && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    volumes:
      - local_uploads:/data/uploads
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      db: {condition: service_healthy}
    networks: [internal]

  n8n:
    image: n8nio/n8n:2.43.5
    restart: unless-stopped
    env_file: [.env]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: loan_engine
      DB_POSTGRESDB_SCHEMA: n8n
      DB_POSTGRESDB_USER: loan_engine
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-loan_engine}
      N8N_HOST: n8n
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      N8N_AWS_SYSTEM_CREDENTIALS_ACCESS_ENABLED: "true"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:-local-only-runner-token}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set a persistent N8N_ENCRYPTION_KEY in .env}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "2"
      N8N_METRICS: "true"
      NODE_EXTRA_CA_CERTS: /certs/rds-ca.pem
    ports: ["127.0.0.1:5678:5678"]
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/seed/workflows:ro
      - ./certs:/certs:ro
    depends_on:
      api: {condition: service_healthy}
    networks: [internal]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ ! -f /home/node/.n8n/.seed-imported ]; then
          n8n import:workflow --separate --input=/seed/workflows
          touch /home/node/.n8n/.seed-imported
        fi
        exec n8n start

  runner:
    image: n8nio/runners:2.43.5
    restart: unless-stopped
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:-local-only-runner-token}
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: "15"
    depends_on: [n8n]
    networks: [internal]

  relay:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://loan_engine:${POSTGRES_PASSWORD:-loan_engine}@db:5432/loan_engine
      APP_ENV: ${APP_ENV:-development}
      RELAY_ENABLED: "true"
    command: ["python", "-m", "app.relay"]
    depends_on:
      db: {condition: service_healthy}
      api: {condition: service_started}
      n8n: {condition: service_started}
    networks: [internal]

  retention:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://loan_engine:${POSTGRES_PASSWORD:-loan_engine}@db:5432/loan_engine
      APP_ENV: ${APP_ENV:-development}
    command: ["python", "-m", "app.retention"]
    volumes:
      - local_uploads:/data/uploads
    depends_on:
      db: {condition: service_healthy}
      api: {condition: service_healthy}
    networks: [internal]
    profiles: [local]

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    ports: ["127.0.0.1:3000:80"]
    depends_on:
      api: {condition: service_healthy}
    networks: [internal]

volumes:
  postgres_data:
  n8n_data:
  local_uploads:

networks:
  internal:
    driver: bridge
