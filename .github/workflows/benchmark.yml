name: Synthetic matching benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: clickpe_benchmark
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/clickpe_benchmark
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: uv sync --locked --extra dev
      - run: uv run python -m scripts.benchmark_matching --output benchmark.json
      - uses: actions/upload-artifact@v7
        with:
          name: synthetic-matching-benchmark
          path: benchmark.json
          retention-days: 7
